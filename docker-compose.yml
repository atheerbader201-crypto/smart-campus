# Smart Campus — تشغيل API + الواجهة (وضع التطوير)
# 1) انسخ .env.example إلى .env وضبط MONGODB_URI
# 2) docker compose up --build
# الواجهة: http://localhost:5173  |  API: http://localhost:5000

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
    restart: always

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - server
    restart: always
