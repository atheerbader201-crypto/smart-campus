# Render Blueprint — API (Docker) + frontend (static)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: smart-campus-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false

  - type: web
    name: smart-campus-1
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-campus-api
          property: host
